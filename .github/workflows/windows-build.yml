name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Only for building and checking the .NET MAUI output; the builder itself does not use it.
      - name: Install the .NET MAUI workload
        run: dotnet workload install maui-windows

      - name: Build
        run: dotnet build StandaloneUiBuilder.sln --configuration Release

      - name: Unit tests
        run: dotnet test tests/StandaloneUiBuilder.Core.Tests --configuration Release --no-build

      # Drives the real editor with mouse and keyboard through the prototype acceptance
      # walkthrough, saving screenshots along the way. Also checks generated WPF and
      # WinForms output and exports the sample project to both.
      - name: UI walkthrough
        env:
          UIB_RUN_UI_TESTS: "1"
          UIB_UI_TEST_ARTIFACTS: ${{ github.workspace }}\artifacts\screenshots
          UIB_EXPORT_DIR: ${{ github.workspace }}\artifacts\generated
        run: dotnet test tests/StandaloneUiBuilder.UiTests --configuration Release --no-build --logger "console;verbosity=normal"

      # Builds and runs the Blazor export of every sample and checks, in Edge, where every
      # control is on every page and that buttons move between pages.
      - name: Web output tests
        if: always()
        env:
          UIB_RUN_WEB_TESTS: "1"
          UIB_UI_TEST_ARTIFACTS: ${{ github.workspace }}\artifacts\screenshots
          UIB_EXPORT_DIR: ${{ github.workspace }}\artifacts\generated
        run: dotnet test tests/StandaloneUiBuilder.Web.Tests --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Screenshot of the sample project
        if: always()
        shell: pwsh
        run: |
          $exe = "src/StandaloneUiBuilder/bin/Release/net10.0-windows/StandaloneUiBuilder.exe"
          $sample = (Resolve-Path "docs/samples/customer-form.uibproj").Path
          $app = Start-Process -FilePath $exe -ArgumentList "`"$sample`"" -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw "The editor exited during startup (exit code $($app.ExitCode))." }

          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          New-Item -ItemType Directory -Force -Path artifacts/screenshots | Out-Null
          $bitmap.Save("artifacts/screenshots/00-sample-project.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $graphics.Dispose(); $bitmap.Dispose()

          Stop-Process -Id $app.Id

      # Every exported sample must build and run as an ordinary WPF, WinForms, WinUI 3 or .NET MAUI application.
      - name: Build and run the generated apps
        if: always()
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force -Path artifacts/screenshots | Out-Null
          foreach ($target in "wpf", "winforms", "winui", "maui") {
            Get-ChildItem "artifacts/generated/$target" -Directory | ForEach-Object {
              $name = $_.Name
              dotnet build "$($_.FullName)/$name.csproj" --configuration Release
              if ($LASTEXITCODE -ne 0) { throw "The generated $target project $name did not build." }

              $exe = Get-ChildItem "$($_.FullName)/bin/Release" -Recurse -Filter "$name.exe" | Select-Object -First 1
              $app = Start-Process -FilePath $exe.FullName -PassThru
              Start-Sleep -Seconds 8
              if ($app.HasExited) { throw "The generated $target app $name exited during startup (exit code $($app.ExitCode))." }

              $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
              $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
              $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
              $bitmap.Save("artifacts/screenshots/20-$target-$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
              $graphics.Dispose(); $bitmap.Dispose()
              Stop-Process -Id $app.Id
            }
          }

      # Also print each screenshot as base64 so it can be read from the job log where
      # artifact downloads are not reachable.
      - name: Print screenshots
        if: always()
        shell: pwsh
        run: |
          Get-Content artifacts/screenshots/timings.txt -ErrorAction SilentlyContinue
          Get-ChildItem artifacts/screenshots -Filter *.png -ErrorAction SilentlyContinue | ForEach-Object {
            $base64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName))
            Write-Output "SCREENSHOT-BASE64-BEGIN $($_.Name)"
            for ($i = 0; $i -lt $base64.Length; $i += 4000) {
              Write-Output $base64.Substring($i, [Math]::Min(4000, $base64.Length - $i))
            }
            Write-Output "SCREENSHOT-BASE64-END"
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: artifacts/screenshots/*.png

      # A self-contained, single-file build that runs without Visual Studio or an
      # installed .NET runtime.
      - name: Publish self-contained release
        run: >
          dotnet publish src/StandaloneUiBuilder/StandaloneUiBuilder.csproj
          --configuration Release --runtime win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          --output artifacts/publish

      - name: Check the published build starts
        shell: pwsh
        run: |
          $app = Start-Process -FilePath "artifacts/publish/StandaloneUiBuilder.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw "The published editor exited during startup (exit code $($app.ExitCode))." }
          Stop-Process -Id $app.Id

      # The Windows installer (installer/StandaloneUiBuilder.wxs), installed, started and
      # removed again, as a user would.
      - name: Build the installer
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix build installer/StandaloneUiBuilder.wxs -arch x64 `
            -d PublishDir=artifacts/publish -d SamplesDir=docs/samples -d Version=1.0.${{ github.run_number }} `
            -o artifacts/installer/StandaloneUiBuilder.msi
          if ($LASTEXITCODE -ne 0) { throw "The installer did not build." }

      - name: Check the installer installs, starts and uninstalls
        shell: pwsh
        run: |
          $msi = (Resolve-Path "artifacts/installer/StandaloneUiBuilder.msi").Path
          $installed = Join-Path $env:LOCALAPPDATA "Programs\Standalone UI Builder"
          $install = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v artifacts/installer/install.log" -Wait -PassThru
          if ($install.ExitCode -ne 0) { Get-Content artifacts/installer/install.log -Tail 60; throw "Install failed ($($install.ExitCode))." }
          $exe = Get-ChildItem $installed, (Join-Path $env:ProgramFiles "Standalone UI Builder") -Filter StandaloneUiBuilder.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $exe) { throw "The editor was not installed." }
          Write-Output "Installed at $($exe.FullName)"
          if (-not (Test-Path (Join-Path $exe.DirectoryName "Samples\layout-demo.uibproj"))) { throw "The samples were not installed." }
          $association = (Get-ItemProperty "HKCU:\Software\Classes\.uibproj" -ErrorAction SilentlyContinue).'(default)'
          if ($association -ne "StandaloneUiBuilder.Project") { throw "Project files are not associated with the editor ($association)." }

          $app = Start-Process -FilePath $exe.FullName -ArgumentList "`"$(Join-Path $exe.DirectoryName 'Samples\layout-demo.uibproj')`"" -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw "The installed editor exited during startup (exit code $($app.ExitCode))." }
          Stop-Process -Id $app.Id

          $uninstall = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstall failed ($($uninstall.ExitCode))." }
          if (Test-Path $exe.FullName) { throw "The editor was left behind after uninstalling." }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-samples
          path: |
            artifacts/generated/*/*/*.cs
            artifacts/generated/*/*/*.xaml
            artifacts/generated/*/*/*.csproj

      - uses: actions/upload-artifact@v4
        with:
          name: StandaloneUiBuilder-win-x64
          path: |
            artifacts/publish/StandaloneUiBuilder.exe
            docs/samples/customer-form.uibproj

      - uses: actions/upload-artifact@v4
        with:
          name: StandaloneUiBuilder-installer
          path: artifacts/installer/StandaloneUiBuilder.msi
