name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build StandaloneUiBuilder.sln --configuration Release

      - name: Test
        run: dotnet test StandaloneUiBuilder.sln --configuration Release --no-build

      - name: Launch and capture screenshot
        shell: pwsh
        run: |
          $exe = "src/StandaloneUiBuilder/bin/Release/net10.0-windows/StandaloneUiBuilder.exe"
          # Open the sample project so the screenshot shows every control type.
          $sample = (Resolve-Path "docs/samples/customer-form.uibproj").Path
          $app = Start-Process -FilePath $exe -ArgumentList "`"$sample`"" -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw "The editor exited during startup (exit code $($app.ExitCode))." }

          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $bitmap.Save("artifacts/main-window.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $graphics.Dispose(); $bitmap.Dispose()

          Stop-Process -Id $app.Id

          # Also print the image as base64 so it can be read from the job log where
          # artifact downloads are not reachable.
          $base64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes("artifacts/main-window.png"))
          Write-Output "SCREENSHOT-BASE64-BEGIN"
          for ($i = 0; $i -lt $base64.Length; $i += 4000) {
            Write-Output $base64.Substring($i, [Math]::Min(4000, $base64.Length - $i))
          }
          Write-Output "SCREENSHOT-BASE64-END"

      - uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: artifacts/main-window.png
